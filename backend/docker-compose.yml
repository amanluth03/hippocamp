version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: hippocamp-db
    environment:
      POSTGRES_USER: hippocamp
      POSTGRES_PASSWORD: hippocamp_local
      POSTGRES_DB: hippocamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

