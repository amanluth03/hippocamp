# GitHub Actions CI/CD Pipeline for Hippo Campus
# Deploys frontend to S3 and backend to Lambda

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # DEPLOY FRONTEND
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://${{ secrets.DOMAIN_NAME }}/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "manifest.json" \
            --exclude "sw.js"
          
          # Upload HTML and service worker with no-cache
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          
          aws s3 cp frontend/dist/manifest.json s3://${{ secrets.S3_FRONTEND_BUCKET }}/manifest.json \
            --cache-control "no-cache, no-store, must-revalidate"
          
          aws s3 cp frontend/dist/sw.js s3://${{ secrets.S3_FRONTEND_BUCKET }}/sw.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/manifest.json" "/sw.js"

  # ===========================================================================
  # DEPLOY BACKEND
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build dependencies with Docker (Lambda-compatible)
        working-directory: backend
        run: |
          # Create package directory
          mkdir -p package
          
          # Use Docker to build dependencies for Lambda's Linux environment
          # This ensures numpy and other compiled packages are compatible
          docker run --rm -v "$PWD":/var/task public.ecr.aws/sam/build-python3.11:latest \
            pip install -r /var/task/requirements.txt -t /var/task/package/ --no-cache-dir

      - name: Copy application code
        working-directory: backend
        run: |
          cp -r app package/
          cp lambda_handler.py package/

      - name: Create deployment package
        working-directory: backend/package
        run: zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda via S3
        run: |
          # Upload to S3 first (supports larger packages up to 250MB)
          aws s3 cp backend/lambda.zip s3://${{ secrets.S3_FRONTEND_BUCKET }}/lambda-deploy/lambda.zip
          
          # Deploy from S3
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --s3-bucket ${{ secrets.S3_FRONTEND_BUCKET }} \
            --s3-key lambda-deploy/lambda.zip \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}
          
      - name: Cleanup S3 deployment artifact
        run: |
          aws s3 rm s3://${{ secrets.S3_FRONTEND_BUCKET }}/lambda-deploy/lambda.zip

  # ===========================================================================
  # DEPLOY THUMBNAIL LAMBDA
  # ===========================================================================
  deploy-thumbnail:
    name: Deploy Thumbnail Lambda
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment package with Pillow
        working-directory: backend/lambdas/thumbnail
        run: |
          # Create package directory first
          mkdir -p package
          
          # Use Docker to build Pillow for Lambda's Linux environment
          # Run as current user to avoid permission issues
          docker run --rm -v "$PWD":/var/task -u "$(id -u):$(id -g)" public.ecr.aws/sam/build-python3.11:latest \
            pip install Pillow -t /var/task/package/ --no-cache-dir
          
          # Copy handler to package
          cp handler.py package/
          
          # Create zip
          cd package && zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.THUMBNAIL_LAMBDA_NAME }} \
            --zip-file fileb://backend/lambdas/thumbnail/lambda.zip \
            --publish

  # ===========================================================================
  # RUN DATABASE MIGRATIONS
  # ===========================================================================
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

